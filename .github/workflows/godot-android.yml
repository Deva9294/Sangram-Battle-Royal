name: SANGRAM Godot Android APK

on:
  workflow_dispatch:
  push:
    branches: [godot-migration]
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'export_presets.cfg'
      - '.github/workflows/godot-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Godot Android export environment
        run: |
          mkdir -p ~/.config ~/.local/share/godot/export_templates
          cp -a /root/.config/godot ~/.config/
          cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/

      - name: Validate project and import assets
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SANGRAM.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANGRAM-Android-debug
          path: build/SANGRAM.apk
          if-no-files-found: error
          retention-days: 14

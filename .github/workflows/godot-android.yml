name: SANGRAM Godot Android APK

on:
  workflow_dispatch:
  push:
    branches: [godot-migration]
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'export_presets.cfg'
      - '.github/workflows/godot-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Godot Android export environment
        run: |
          mkdir -p ~/.config ~/.local/share/godot/export_templates
          if [ "$HOME" != "/root" ]; then
            cp -a /root/.config/godot "$HOME/.config/"
            cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          fi

      - name: Validate project and import assets
        run: godot --headless --editor --path . --quit

      - name: Configure Android SDK and debug signing
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -z "$SDK_PATH" ]; then
            echo "Android SDK path was not provided by the build image"
            exit 1
          fi
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          EOF
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android debug APK
        run: |
          godot --headless --path . --export-debug "Android" build/SANGRAM.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANGRAM-Android-debug
          path: build/SANGRAM.apk
          if-no-files-found: error
          retention-days: 14

name: SANGRAM Godot Android APK - Gameplay Update

on:
  workflow_dispatch:
  push:
    branches: [godot-migration, mp-lobby-upgrade, godot-player-upgrade]
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'export_presets.cfg'
      - '.github/workflows/godot-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Godot Android export environment
        run: |
          mkdir -p ~/.config ~/.local/share/godot/export_templates
          if [ "$HOME" != "/root" ]; then
            cp -a /root/.config/godot "$HOME/.config/"
            cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          fi

      - name: Download CC0 soldier models for offline game
        run: bash tools/download_cc0_assets.sh

      - name: Validate project and import assets
        run: godot --headless --editor --path . --quit

      - name: Smoke test deployment lobby at runtime
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 4 2>&1 | tee /tmp/sangram-lobby.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/sangram-lobby.log; then exit 1; fi

      - name: Smoke test battle scene at runtime
        shell: bash
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 --path . --quit-after 3600 res://scenes/game.tscn 2>&1 | tee /tmp/sangram-game.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/sangram-game.log; then exit 1; fi

      - name: Configure Android SDK and debug signing
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -z "$SDK_PATH" ]; then
            echo "Android SDK path was not provided by the build image"
            exit 1
          fi
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          EOF
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Diagnose Android export configuration
        run: |
          echo "Godot export templates:"
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable"
          echo "Android SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true
          echo "Android SDK build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true
          echo "Debug keystore:"
          ls -l "$GITHUB_WORKSPACE/debug.keystore"
          echo "Godot editor settings:"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Export Android debug APK
        run: |
          godot --headless --path . --export-debug "Android" build/SANGRAM.apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANGRAM-Android-debug
          path: build/SANGRAM.apk
          if-no-files-found: error
          retention-days: 14

name: Build SANGRAM Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - 'export_presets.cfg'
      - '.github/workflows/godot-android.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK from runner image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found at $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager is missing from the GitHub runner image"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed

      - name: Install Godot 4.4.1 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.4.1
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo install -m 0755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version
          java -version
          sdkmanager --list_installed

      - name: Download and vendor CC0 game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/characters/soldier assets/animations/quaternius assets/environment/buildings assets/environment/grass assets/licenses
          BASE=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/aa02a4e6d8337a0604d2da131bcbbeb1f01badf0/public/assets/vendor/quaternius
          curl -fL "$BASE/night-striker.glb" -o assets/characters/soldier/soldier.glb
          curl -fL "$BASE/universal-animation-library.glb" -o assets/animations/quaternius/universal-animation-library.glb
          curl -fL "$BASE/LICENSE-BASE-CHARACTERS.txt" -o assets/licenses/QUATERNIUS-BASE-CHARACTERS.txt
          curl -fL "$BASE/LICENSE-ANIMATIONS.txt" -o assets/licenses/QUATERNIUS-ANIMATIONS.txt
          curl -fL "https://raw.githubusercontent.com/Hidencod/tge-assets/main/LICENSE" -o assets/licenses/KENNEY-CC0.txt
          CITY=https://raw.githubusercontent.com/Hidencod/tge-assets/main/packs/city-kit-suburban
          for model in building-type-a building-type-b building-type-c building-type-d; do
            curl -fL "$CITY/${model}.glb" -o "assets/environment/buildings/${model}.glb"
          done
          GRASS=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/aa02a4e6d8337a0604d2da131bcbbeb1f01badf0/public/assets/vendor/ambientcg/grass007
          for map in color normal-gl roughness; do
            curl -fL "$GRASS/${map}.jpg" -o "assets/environment/grass/${map}.jpg"
          done
          cat > assets/ASSET_SOURCES.md <<'EOF'
          # Sangram third-party assets
          - Quaternius Universal Base Characters and Universal Animation Library, CC0 1.0. Original source: https://quaternius.com/
          - Kenney City Kit Suburban GLB models, CC0 1.0. Original creator: Kenney. Mirror: https://github.com/Hidencod/tge-assets
          - ambientCG Grass 007 PBR maps, CC0 1.0. Source: https://ambientcg.com/view?id=Grass007
          See assets/licenses/ for bundled license notices.
          EOF
          test "$(head -c 4 assets/characters/soldier/soldier.glb)" = "glTF"
          test "$(head -c 4 assets/animations/quaternius/universal-animation-library.glb)" = "glTF"
          echo "Downloaded asset sizes:"
          du -h assets/characters/soldier/soldier.glb assets/animations/quaternius/universal-animation-library.glb assets/environment/buildings/*.glb assets/environment/grass/*.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Add free CC0 soldier, animation, building and PBR assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Validate main scene
        run: timeout 30s godot --headless --path . --quit-after 5

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/SANGRAM.apk
          test -s build/SANGRAM.apk
          ls -lh build/SANGRAM.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANGRAM-Godot-Android-APK
          path: build/SANGRAM.apk
          if-no-files-found: error
          retention-days: 14
